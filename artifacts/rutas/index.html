<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas — Explorador Outdoor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    #map { height: calc(100vh - 4.5rem); width: 100%; z-index: 10; }
    .leaflet-popup-content-wrapper {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #1e293b;
      border-radius: 1.25rem;
      padding: 6px;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5), 0 8px 10px -6px rgb(0 0 0 / 0.5);
    }
    .leaflet-popup-tip { background: #0f172a; border: 1px solid #1e293b; }
    .custom-pulse {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md z-30 flex-shrink-0 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-18 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-cyan-500 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30 font-bold text-xl">
          🌲
        </div>
        <div>
          <h1 class="font-extrabold text-base sm:text-lg tracking-tight text-white flex items-center gap-2">
            Rutas <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 font-semibold tracking-normal">Outdoor</span>
          </h1>
          <p class="text-xs text-slate-400 hidden sm:block">Exploración y cartografía de senderismo en Galicia</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="sidebarToggle" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs sm:text-sm font-semibold transition flex items-center gap-2 shadow-md shadow-emerald-600/20">
          <i data-lucide="map" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Rutas</span>
          <span id="routeCountBadge" class="px-2 py-0.5 rounded-full bg-emerald-950/60 text-emerald-300 text-xs font-bold border border-emerald-500/30">4</span>
        </button>
        <a href="../../" class="px-3 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white text-xs sm:text-sm font-medium border border-slate-700/80 transition flex items-center gap-1.5 shadow-sm">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Catálogo</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container: Map + Sidebar -->
  <div class="flex-1 relative flex overflow-hidden">

    <!-- Leaflet Map -->
    <div id="map" class="flex-1"></div>

    <!-- Floating / Slide-over Sidebar for Route Details -->
    <aside id="sidebar" class="absolute inset-y-0 right-0 z-40 w-full sm:w-[420px] bg-slate-900/98 backdrop-blur-xl border-l border-slate-800/80 shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
      
      <!-- Sidebar Header -->
      <div class="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
        <div class="flex items-center gap-2.5">
          <div class="p-2 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <i data-lucide="compass" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="font-bold text-white text-base">Rutas Registradas</h2>
            <p class="text-xs text-slate-400">Selecciona una ruta para ubicarla en el mapa</p>
          </div>
        </div>
        <button id="closeSidebar" class="p-2 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Search & Filters -->
      <div class="p-4 border-b border-slate-800/60 bg-slate-950/60 space-y-3">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
          <input type="text" id="routeSearch" placeholder="Buscar por nombre, zona o descripción..." class="w-full bg-slate-900 text-slate-100 text-xs sm:text-sm rounded-xl pl-10 pr-4 py-2.5 border border-slate-700/80 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 placeholder-slate-500 shadow-inner">
        </div>
        <div class="flex items-center justify-between text-xs pt-1">
          <span class="text-slate-400 font-medium">Filtrar por estado:</span>
          <select id="statusFilter" class="bg-slate-900 text-slate-200 rounded-lg px-3 py-1.5 border border-slate-700/80 focus:outline-none focus:ring-1 focus:ring-emerald-500 font-medium cursor-pointer">
            <option value="all">Todas las rutas</option>
            <option value="Verificada">Verificadas</option>
            <option value="Pendiente">Pendientes</option>
          </select>
        </div>
      </div>

      <!-- Route Cards List -->
      <div id="routesList" class="flex-1 overflow-y-auto p-4 space-y-3.5 divide-y divide-slate-800/40">
        <!-- Rendered via JS -->
      </div>

      <!-- Sidebar Footer -->
      <div class="p-4 border-t border-slate-800 bg-slate-950/90 text-center text-xs text-slate-500 flex items-center justify-between">
        <span>Galicia · Outdoor Exploration</span>
        <span class="text-emerald-400 font-medium">100% Interactivo</span>
      </div>
    </aside>

  </div>

  <script>
    // Lucide Icons
    lucide.createIcons();

    // Routes Data with real locations (TikTok + Google Maps references)
    const routesData = [
      {
        id: 1,
        title: "Ruta 1",
        subtitle: "—",
        category: "Pendiente",
        status: "Pendiente",
        location: "(ver enlace)",
        lat: 42.8800,
        lng: -8.0200,
        distance: "—",
        elevation: "—",
        description: "Ruta de exploración pendiente de catalogar.",
        tags: ["#Pendiente"],
        mapsQuery: "https://maps.app.goo.gl/kHAVvYc7HcS2ZJcK6?g_st=atm",
        tiktok: "https://vm.tiktok.com/ZNdSfsoEK/"
      },
      {
        id: 2,
        title: "Ruta 2",
        subtitle: "—",
        category: "Pendiente",
        status: "Pendiente",
        location: "(ver enlace)",
        lat: 42.4600,
        lng: -7.8900,
        distance: "—",
        elevation: "—",
        description: "Ruta de exploración pendiente de catalogar.",
        tags: ["#Pendiente"],
        mapsQuery: "https://maps.app.goo.gl/1bB3YM7ovSe6bqpS9?g_st=atm",
        tiktok: "https://vm.tiktok.com/ZNdSf4JSy/"
      },
      {
        id: 3,
        title: "Ruta 3 (TikTok)",
        subtitle: "—",
        category: "Pendiente",
        status: "Pendiente",
        location: "(ver TikTok)",
        lat: 42.2400,
        lng: -8.3100,
        distance: "—",
        elevation: "—",
        description: "Ruta de exploración pendiente de catalogar.",
        tags: ["#Pendiente"],
        mapsQuery: "https://maps.app.goo.gl/kHAVvYc7HcS2ZJcK6?g_st=atm",
        tiktok: "https://vm.tiktok.com/ZNdSfsoEK/"
      },
      {
        id: 4,
        title: "Ruta 4 (TikTok)",
        subtitle: "—",
        category: "Pendiente",
        status: "Pendiente",
        location: "(ver TikTok)",
        lat: 42.7100,
        lng: -7.4200,
        distance: "—",
        elevation: "—",
        description: "Ruta de exploración pendiente de catalogar.",
        tags: ["#Pendiente"],
        mapsQuery: "https://maps.app.goo.gl/1bB3YM7ovSe6bqpS9?g_st=atm",
        tiktok: "https://vm.tiktok.com/ZNdSf4JSy/"
      }
    ];

    // Initialize Leaflet Map centered on Galicia
    const map = L.map('map', {
      zoomControl: false
    }).setView([42.6000, -8.0000], 9);

    // Add zoom control to top-left
    L.control.zoom({ position: 'topleft' }).addTo(map);

    // Add Esri World Topo Map (Free, highly detailed topographic tiles)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community',
      maxZoom: 19
    }).addTo(map);

    const markers = {};

    function createCustomIcon(status) {
      const color = status === 'Verificada' ? '#10b981' : '#f59e0b';
      return L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="custom-pulse" style="background-color: ${color}; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; box-shadow: 0 6px 16px rgba(0,0,0,0.6); border: 3px solid #0f172a; font-size: 14px;">🏔️</div>`,
        iconSize: [34, 34],
        iconAnchor: [17, 17],
        popupAnchor: [0, -14]
      });
    }

    function renderMarkers(filteredRoutes) {
      Object.values(markers).forEach(m => map.removeLayer(m));

      filteredRoutes.forEach(r => {
        const marker = L.marker([r.lat, r.lng], { icon: createCustomIcon(r.status) }).addTo(map);
        
        const popupContent = `
          <div class="p-3 space-y-2.5 max-w-xs">
            <div class="flex items-center justify-between">
              <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold uppercase tracking-wider ${r.status === 'Verificada' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'}">${r.status}</span>
              <span class="text-xs text-slate-400 font-medium">${r.category}</span>
            </div>
            <div>
              <h3 class="font-bold text-white text-base">${r.title}</h3>
              <p class="text-xs text-emerald-400 font-medium">${r.subtitle}</p>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">${r.description}</p>
            <div class="grid grid-cols-2 gap-2 py-1.5 px-2 rounded-xl bg-slate-950/60 border border-slate-800 text-xs">
              <div><span class="text-slate-400">Distancia:</span> <strong class="text-white">${r.distance}</strong></div>
              <div><span class="text-slate-400">Desnivel:</span> <strong class="text-white">${r.elevation}</strong></div>
            </div>
            <div class="pt-1 flex flex-col gap-1.5 border-t border-slate-800/80">
              <div class="flex items-center justify-between">
                <span class="text-[11px] text-slate-400 truncate max-w-[150px]">📍 ${r.location}</span>
                <div class="flex gap-1.5">
                  <a href="${r.mapsQuery}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-semibold transition shadow-sm flex items-center gap-1">
                    Google Maps ↗
                  </a>
                  ${r.tiktok ? `<a href="${r.tiktok}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white text-xs font-semibold transition shadow-sm flex items-center gap-1">
                    TikTok ↗
                  </a>` : ''}
                </div>
              </div>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent);
        markers[r.id] = marker;
      });
    }

    function renderSidebar(filteredRoutes) {
      const container = document.getElementById('routesList');
      document.getElementById('routeCountBadge').textContent = filteredRoutes.length;

      if (filteredRoutes.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 text-xs">No se encontraron rutas con los filtros aplicados.</div>`;
        return;
      }

      container.innerHTML = filteredRoutes.map(r => `
        <div onclick="focusRoute(${r.id})" class="p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-800/80 border border-slate-700/60 cursor-pointer transition-all space-y-2.5 group shadow-sm hover:shadow-md hover:border-emerald-500/40">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-emerald-400 group-hover:underline">${r.category}</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold uppercase tracking-wider ${r.status === 'Verificada' ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/15 text-amber-400 border border-amber-500/30'}">${r.status}</span>
          </div>
          <div>
            <h3 class="font-bold text-white text-sm sm:text-base group-hover:text-emerald-300 transition">${r.title}</h3>
            <p class="text-xs text-slate-400">${r.subtitle}</p>
          </div>
          <p class="text-xs text-slate-300 line-clamp-2 leading-relaxed">${r.description}</p>
          <div class="flex items-center justify-between pt-2 border-t border-slate-800/85 text-xs text-slate-400">
            <span class="flex items-center gap-1 flex-wrap">
              <a href="${r.mapsQuery}" target="_blank" rel="noopener noreferrer" class="text-emerald-400 hover:text-emerald-300 hover:underline flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-400"></i> Google Maps</a>
              ${r.tiktok ? `<a href="${r.tiktok}" target="_blank" rel="noopener noreferrer" class="text-pink-400 hover:text-pink-300 hover:underline flex items-center gap-1"><i data-lucide="video" class="w-3.5 h-3.5 text-pink-400"></i> TikTok</a>` : ''}
            </span>
            <span class="text-emerald-400 font-semibold flex items-center gap-1">Ver en mapa →</span>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function updateView() {
      const q = document.getElementById('routeSearch').value.toLowerCase().trim();
      const status = document.getElementById('statusFilter').value;

      const filtered = routesData.filter(r => {
        const matchesQ = !q || r.title.toLowerCase().includes(q) || r.subtitle.toLowerCase().includes(q) || r.description.toLowerCase().includes(q) || r.location.toLowerCase().includes(q);
        const matchesStatus = status === 'all' || r.status === status;
        return matchesQ && matchesStatus;
      });

      renderMarkers(filtered);
      renderSidebar(filtered);
    }

    function focusRoute(id) {
      const r = routesData.find(item => item.id === id);
      if (r && markers[id]) {
        map.setView([r.lat, r.lng], 13, { animate: true });
        markers[id].openPopup();
        if (window.innerWidth < 640) {
          toggleSidebar();
        }
      }
    }

    const sidebar = document.getElementById('sidebar');
    let sidebarOpen = false;

    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      if (sidebarOpen) {
        sidebar.classList.remove('translate-x-full');
      } else {
        sidebar.classList.add('translate-x-full');
      }
    }

    document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
    document.getElementById('closeSidebar').addEventListener('click', toggleSidebar);

    document.getElementById('routeSearch').addEventListener('input', updateView);
    document.getElementById('statusFilter').addEventListener('change', updateView);

    window.addEventListener('DOMContentLoaded', () => {
      renderMarkers(routesData);
      renderSidebar(routesData);
      if (window.innerWidth >= 640) {
        toggleSidebar();
      }
    });
  </script>
</body>
</html>
